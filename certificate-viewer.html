<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Certificate | Janani Somasiri</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg?v=1">
    <script>document.documentElement.dataset.theme=localStorage.getItem("portfolio-theme")||"dark";</script>
    <style>
        *{box-sizing:border-box}
        html,body{width:100%;height:100%;margin:0}
        body{display:grid;grid-template-rows:68px 1fr;color:#f8fafc;background:#030914;font-family:Arial,sans-serif;overflow:hidden}
        header{display:flex;padding:10px 22px;align-items:center;gap:16px;border-bottom:1px solid rgba(148,163,184,.2);background:linear-gradient(90deg,#07101e,#0b1326)}
        .brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:800}.brand img{width:34px;height:34px}.brand b{color:#ff8613}
        h1{min-width:0;margin:0 auto;color:#dce4ef;font-size:.9rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .back{display:inline-flex;min-height:40px;padding:9px 15px;align-items:center;color:#fff;border:1px solid rgba(139,92,246,.55);border-radius:10px;text-decoration:none;background:rgba(124,58,237,.1);font-size:.75rem}
        iframe{display:block;width:100%;height:100%;border:0;background:#202124}
        .error{display:none;margin:auto;padding:30px;color:#fca5a5;text-align:center}
        html[data-theme="light"] body{color:#172033;background:#eef2f7}
        html[data-theme="light"] header{border-bottom-color:#dbe3ee;background:rgba(255,255,255,.96);box-shadow:0 5px 20px rgba(30,41,59,.08)}
        html[data-theme="light"] .brand{color:#172033}
        html[data-theme="light"] h1{color:#334155}
        html[data-theme="light"] .back{color:#5b21b6;border-color:#c4b5fd;background:#f3efff}
        html[data-theme="light"] iframe{background:#dfe5ec}
        html[data-theme="light"] .error{color:#b91c1c}
        .page-drape{position:fixed;inset:0;z-index:99999;overflow:hidden;pointer-events:none;animation:viewer-drape-away 1.05s cubic-bezier(.76,0,.24,1) .12s forwards}.page-drape::before,.page-drape::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#140b2d,#4c1d95 48%,#c2410c)}.page-drape::after{background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.2),transparent 24%)}.page-drape span{position:absolute;left:50%;top:50%;z-index:2;width:54px;height:54px;border:3px solid rgba(255,255,255,.28);border-top-color:#fff;border-radius:50%;transform:translate(-50%,-50%);animation:viewer-drape-spin .7s linear infinite}@keyframes viewer-drape-away{0%{clip-path:inset(0 0 0 0);opacity:1}75%{clip-path:inset(0 0 0 0);opacity:1}100%{clip-path:inset(0 0 100% 0);opacity:0;visibility:hidden}}@keyframes viewer-drape-spin{to{transform:translate(-50%,-50%) rotate(360deg)}}@media(prefers-reduced-motion:reduce){.page-drape{display:none}}        @media(max-width:600px){header{padding-inline:12px}.brand span{display:none}h1{font-size:.72rem}.back{padding-inline:10px}}
    </style>
</head>
<body>
    <div class="page-drape" aria-hidden="true"><span></span></div>
    <header>
        <a class="brand" href="index.html#certificates"><img src="images/branding/janani-mark.svg" alt=""><span>Janani Somasiri<b>.</b></span></a>
        <h1 id="viewer-title">Certificate</h1>
        <a class="back" href="index.html#certificates">Back to Portfolio</a>
    </header>
    <iframe id="pdf-frame" title="Certificate PDF"></iframe>
    <p class="error" id="viewer-error">This certificate file could not be opened.</p>
    <script>
        const params = new URLSearchParams(location.search);
        const file = params.get('file') || '';
        const title = params.get('title') || 'Certificate';
        const allowed = /^certificate-document-\d{2}\.pdf$/;
        const frame = document.getElementById('pdf-frame');
        const error = document.getElementById('viewer-error');
        document.getElementById('viewer-title').textContent = title;
        document.title = `${title} | Janani Somasiri`;
        if (allowed.test(file)) frame.src = `documents/certificates/${file}`;
        else { frame.style.display = 'none'; error.style.display = 'block'; }
    </script>
</body>
</html>
