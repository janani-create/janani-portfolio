<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Certificate | Janani Somasiri</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg?v=1">
    <style>
        *{box-sizing:border-box}
        html,body{width:100%;height:100%;margin:0}
        body{display:grid;grid-template-rows:68px 1fr;color:#f8fafc;background:#030914;font-family:Arial,sans-serif;overflow:hidden}
        header{display:flex;padding:10px 22px;align-items:center;gap:16px;border-bottom:1px solid rgba(148,163,184,.2);background:linear-gradient(90deg,#07101e,#0b1326)}
        .brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:800}.brand img{width:34px;height:34px}.brand b{color:#ff8613}
        h1{min-width:0;margin:0 auto;color:#dce4ef;font-size:.9rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .back{display:inline-flex;min-height:40px;padding:9px 15px;align-items:center;color:#fff;border:1px solid rgba(139,92,246,.55);border-radius:10px;text-decoration:none;background:rgba(124,58,237,.1);font-size:.75rem}
        iframe{display:block;width:100%;height:100%;border:0;background:#202124}
        .error{display:none;margin:auto;padding:30px;color:#fca5a5;text-align:center}
        @media(max-width:600px){header{padding-inline:12px}.brand span{display:none}h1{font-size:.72rem}.back{padding-inline:10px}}
    </style>
</head>
<body>
    <header>
        <a class="brand" href="index.html#certificates"><img src="images/favicon.svg" alt=""><span>Janani Somasiri<b>.</b></span></a>
        <h1 id="viewer-title">Certificate</h1>
        <a class="back" href="index.html#certificates">Back to Portfolio</a>
    </header>
    <iframe id="pdf-frame" title="Certificate PDF"></iframe>
    <p class="error" id="viewer-error">This certificate file could not be opened.</p>
    <script>
        const params = new URLSearchParams(location.search);
        const file = params.get('file') || '';
        const title = params.get('title') || 'Certificate';
        const allowed = /^certificate-document-\d{2}\.pdf$/;
        const frame = document.getElementById('pdf-frame');
        const error = document.getElementById('viewer-error');
        document.getElementById('viewer-title').textContent = title;
        document.title = `${title} | Janani Somasiri`;
        if (allowed.test(file)) frame.src = `documents/certificates/${file}`;
        else { frame.style.display = 'none'; error.style.display = 'block'; }
    </script>
</body>
</html>
